---
apiVersion: v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-database
  template:
    metadata:
      labels:
        app: app-database
    spec:
      containers:
      name: dbcont1
      image: anooppuli/phpapp:dbimage
      ports:
        - containerPort: 3306

      #Secret integration
      envFrom:
        - secretRef:
            name: bankapp-secret
    
      #ResourceQuota integration
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"

      volumeMounts:
        - name: pvc-1
          mountPath: /usr/share/nginx/html
  
  volumeClaimTemplates:
    - metadata:
        name: pvc-1
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

      